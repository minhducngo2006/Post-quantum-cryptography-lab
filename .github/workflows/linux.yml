name: Linux CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build

      - name: Provision pinned native backend
        run: bash scripts/provision-linux.sh

      - name: Verify backend preflight
        run: |
          export OQS_INSTALL_PATH="$GITHUB_WORKSPACE/.native/liboqs"
          uv run --locked pqclab doctor

      - name: Run tests
        run: |
          export OQS_INSTALL_PATH="$GITHUB_WORKSPACE/.native/liboqs"
          uv run --locked --extra dev pytest -q

      - name: Ruff lint and formatting
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .
